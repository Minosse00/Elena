<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestione Presenze e Riconciliazione</title>
  <style>
    :root {
      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #212529;
      --border: #dee2e6;
      --primary: #0d6efd;
      --danger: #dc3545;
      --header-bg: #e9ecef;
      --edit-bg: #fffde7;
    }

    [data-theme="dark"] {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #e0e0e0;
      --border: #333333;
      --primary: #3d8bfd;
      --danger: #ea868f;
      --header-bg: #2d2d2d;
      --edit-bg: #2a2a1a;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    .container { max-width: 1100px; margin: 0 auto; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; align-items: end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 0.85rem; font-weight: 600; }
    input, select, button { padding: 8px; border: 1px solid var(--border); border-radius: 4px; background: var(--card-bg); color: var(--text); }
    button { cursor: pointer; background: var(--primary); color: white; border: none; font-weight: 600; }
    .btn-danger { background: var(--danger); }
    .btn-secondary { background: #6c757d; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; font-size: 0.9rem; }
    th { background: var(--header-bg); }

    /* Celle registro editabili */
    td[contenteditable="true"] {
      background-color: var(--edit-bg);
      cursor: pointer;
    }
    td[contenteditable="true"]:focus {
      outline: 2px solid var(--primary);
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2>Tracciamento & Riconciliazione Presenze</h2>
    <div>
      <button onclick="toggleTema()" class="btn-secondary">Tema Dark/Light</button>
      <button onclick="esportaBackup()" class="btn-secondary">Esporta Backup</button>
      <button onclick="document.getElementById('fileImport').click()" class="btn-secondary">Ripristina Backup</button>
      <input type="file" id="fileImport" style="display:none" onchange="ripristinaBackup(event)">
    </div>
  </div>

  <!-- Form Inserimento -->
  <div class="card">
    <h3>Nuova Registrazione</h3>
    <form id="formPresenze" onsubmit="aggiungiVoce(event)" class="form-grid">
      <div class="form-group">
        <label>Data Inizio</label>
        <input type="date" id="dataInizio" required>
      </div>
      <div class="form-group">
        <label>Data Fine</label>
        <input type="date" id="dataFine">
      </div>
      <div class="form-group">
        <label>Causale</label>
        <select id="tipo" required>
          <option value="Ferie">Ferie (gg)</option>
          <option value="ROL">ROL (ore)</option>
          <option value="Ex Festività">Ex Festività (ore)</option>
          <option value="Buoni Pasto">Buoni Pasto (n°)</option>
          <option value="Malattia">Malattia (gg)</option>
          <option value="Legge 104">Legge 104 (ore/gg)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantità / Ore</label>
        <input type="number" step="0.5" id="quantita" required placeholder="es. 8">
      </div>
      <div class="form-group">
        <label>Note</label>
        <input type="text" id="note" placeholder="Opzionale">
      </div>
      <button type="submit">Inserisci</button>
    </form>
  </div>

  <!-- Registro Dettaglio con celle Editabili -->
  <div class="card">
    <h3>Registro Dettagliato</h3>
    <table>
      <thead>
        <tr>
          <th>Data Inizio</th>
          <th>Data Fine</th>
          <th>Causale</th>
          <th>Q.tà / Ore</th>
          <th>Gg Lavorativi</th>
          <th>Note</th>
          <th>Azione</th>
        </tr>
      </thead>
      <tbody id="tb-registro"></tbody>
    </table>
  </div>

  <!-- Prospetto Riconciliazione -->
  <div class="card">
    <h3>Prospetto e Saldi Riconciliati</h3>
    <table>
      <thead>
        <tr>
          <th>Tipologia</th>
          <th>Maturato / Spettante</th>
          <th>Usufruito (Registro)</th>
          <th>Saldo Residuo</th>
        </tr>
      </thead>
      <tbody id="tb-prospetto"></tbody>
    </table>
  </div>
</div>

<script>
  let registro = JSON.parse(localStorage.getItem('registro_presenze')) || [
    { id: 1, dataInizio: '2026-09-01', dataFine: '2026-09-02', tipo: 'Ferie', qta: 2, note: 'Ferie estive' },
    { id: 2, dataInizio: '2026-09-10', dataFine: '2026-09-10', tipo: 'ROL', qta: 4, note: 'Permesso' }
  ];

  let maturati = JSON.parse(localStorage.getItem('maturati_presenze')) || {
    'Ferie': 20,
    'ROL': 32,
    'Ex Festività': 32,
    'Buoni Pasto': 20,
    'Malattia': 0,
    'Legge 104': 3
  };

  function calcolaGiorniLavorativi(d1Str, d2Str) {
    if (!d1Str) return 0;
    let d1 = new Date(d1Str + 'T00:00:00');
    let d2 = d2Str ? new Date(d2Str + 'T00:00:00') : new Date(d1Str + 'T00:00:00');
    
    if (isNaN(d1.getTime()) || isNaN(d2.getTime()) || d1 > d2) return 0;
    
    let count = 0;
    let cur = new Date(d1);
    while (cur <= d2) {
      let day = cur.getDay();
      if (day !== 0 && day !== 6) count++;
      cur.setDate(cur.getDate() + 1);
    }
    return count;
  }

  function renderRegistro() {
    const tbody = document.getElementById('tb-registro');
    tbody.innerHTML = '';

    registro.forEach((item, index) => {
      const ggLav = calcolaGiorniLavorativi(item.dataInizio, item.dataFine);
      const tr = document.createElement('tr');
      
      tr.innerHTML = `
        <td contenteditable="true" onblur="aggiornaCampo(${index}, 'dataInizio', this.innerText)">${item.dataInizio || ''}</td>
        <td contenteditable="true" onblur="aggiornaCampo(${index}, 'dataFine', this.innerText)">${item.dataFine || ''}</td>
        <td contenteditable="true" onblur="aggiornaCampo(${index}, 'tipo', this.innerText)">${item.tipo || ''}</td>
        <td contenteditable="true" onblur="aggiornaCampo(${index}, 'qta', this.innerText)">${item.qta || 0}</td>
        <td>${ggLav}</td>
        <td contenteditable="true" onblur="aggiornaCampo(${index}, 'note', this.innerText)">${item.note || ''}</td>
        <td><button class="btn-danger" onclick="eliminaVoce(${index})">Elimina</button></td>
      `;
      tbody.appendChild(tr);
    });

    salvaDati();
    riconcolaTutto();
  }

  function aggiornaCampo(index, campo, valore) {
    let valPulito = valore.trim();
    if (campo === 'qta') {
      valPulito = parseFloat(valPulito) || 0;
    }
    registro[index][campo] = valPulito;
    salvaDati();
    riconcolaTutto();
  }

  function riconcolaTutto() {
    const tbody = document.getElementById('tb-prospetto');
    tbody.innerHTML = '';

    let usufruitoMap = { 'Ferie': 0, 'ROL': 0, 'Ex Festività': 0, 'Buoni Pasto': 0, 'Malattia': 0, 'Legge 104': 0 };

    registro.forEach(item => {
      if (usufruitoMap.hasOwnProperty(item.tipo)) {
        usufruitoMap[item.tipo] += parseFloat(item.qta) || 0;
      }
    });

    Object.keys(maturati).forEach(tipo => {
      const mat = maturati[tipo];
      const usu = usufruitoMap[tipo] || 0;
      const saldo = mat - usu;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>${tipo}</strong></td>
        <td contenteditable="true" onblur="aggiornaMaturato('${tipo}', this.innerText)">${mat}</td>
        <td>${usu}</td>
        <td style="font-weight: bold; color: ${saldo < 0 ? 'var(--danger)' : 'inherit'}">${saldo}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function aggiornaMaturato(tipo, valore) {
    maturati[tipo] = parseFloat(valore.trim()) || 0;
    salvaDati();
    riconcolaTutto();
  }

  function aggiungiVoce(e) {
    e.preventDefault();
    const dInizio = document.getElementById('dataInizio').value;
    const dFine = document.getElementById('dataFine').value || dInizio;
    const tipo = document.getElementById('tipo').value;
    const qta = parseFloat(document.getElementById('quantita').value) || 0;
    const note = document.getElementById('note').value;

    registro.push({ id: Date.now(), dataInizio: dInizio, dataFine: dFine, tipo, qta, note });
    document.getElementById('formPresenze').reset();
    renderRegistro();
  }

  function eliminaVoce(index) {
    registro.splice(index, 1);
    renderRegistro();
  }

  function salvaDati() {
    localStorage.setItem('registro_presenze', JSON.stringify(registro));
    localStorage.setItem('maturati_presenze', JSON.stringify(maturati));
  }

  function toggleTema() {
    const isDark = document.body.getAttribute('data-theme') === 'dark';
    document.body.setAttribute('data-theme', isDark ? 'light' : 'dark');
  }

  function esportaBackup() {
    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ registro, maturati }));
    const a = document.createElement('a');
    a.href = dataStr;
    a.download = `backup_presenze_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
  }

  function ripristinaBackup(e) {
    const reader = new FileReader();
    reader.onload = function(event) {
      try {
        const data = JSON.parse(event.target.result);
        if (data.registro && data.maturati) {
          registro = data.registro;
          maturati = data.maturati;
          renderRegistro();
        }
      } catch (err) {
        alert("File JSON non valido.");
      }
    };
    reader.readAsText(e.target.files[0]);
  }

  renderRegistro();
</script>

</body>
</html>
